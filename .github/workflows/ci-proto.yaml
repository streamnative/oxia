name: Proto

on:
  pull_request:
    branches:
      - main
      - 'release-*'
    # Re-run when the "buf skip breaking" label is added or removed
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  breaking:
    name: Breaking changes
    runs-on: cncf-ubuntu-4-16-x86
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      # Fails on a breaking change to common/proto (rules in buf.yaml). For an
      # intentional break, add the "buf skip breaking" label to the pull request.
      - uses: bufbuild/buf-action@v1
        with:
          version: 1.73.0
          lint: false
          format: false
          pr_comment: false
          breaking_against: "${{ github.event.repository.clone_url }}#format=git,commit=${{ github.event.pull_request.base.sha }},subdir=common/proto"

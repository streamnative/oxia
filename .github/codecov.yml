codecov:
  # Report as soon as the coverage is uploaded, without waiting for the
  # slower chaos-mesh and Maelstrom jobs
  require_ci_to_pass: false

coverage:
  status:
    project:
      # Fail PRs that lower the coverage of main by more than threshold.
      # Identical runs differ by ~0.1%, from timing-dependent paths.
      default:
        target: auto
        threshold: 0.25%
      # Fail PRs that take the overall coverage below the minimum
      minimum:
        target: 95%
    # Fail PRs whose changed lines are less covered than the minimum
    patch:
      default:
        target: 100%

ignore:
  - "**/*.pb.go"

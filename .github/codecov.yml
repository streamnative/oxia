codecov:
  # Report as soon as the coverage is uploaded, without waiting for the
  # slower chaos-mesh and Maelstrom jobs
  require_ci_to_pass: false

coverage:
  status:
    # Overall coverage of the PR against its base commit on main.
    # Set informational to false to fail PRs that lower it by more than threshold.
    # Identical runs differ by ~0.1%, from timing-dependent paths.
    project:
      default:
        target: auto
        threshold: 0.25%
        informational: true
    # Coverage of the lines the PR changes
    patch:
      default:
        informational: true

ignore:
  - "**/*.pb.go"
  # Test harnesses and process entry points
  - "oxiad/coordinator/rpc/rpctest"
  - "tests/mock"
  - "cmd/client/common/client_mock.go"
  - "common/rpc/mock.go"
  - "cmd/main.go"
  - "oxiad/maelstrom/main.go"

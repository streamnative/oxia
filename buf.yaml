# Breaking change detection for the proto definitions, run on every pull request
# by .github/workflows/ci-proto.yaml. To run it locally:
#
#   buf breaking --against 'https://github.com/oxia-db/oxia.git#branch=main'

version: v2
modules:
  - path: common/proto
breaking:
  use:
    # The binary encoding is used between clients and servers of different
    # versions, and in the WAL and the DB. The JSON encoding is used for the
    # cluster configuration and status persisted by the coordinator.
    - WIRE_JSON
    # A removed or renamed RPC or service fails the calls of older peers.
    - RPC_NO_DELETE
    - PACKAGE_SERVICE_NO_DELETE
